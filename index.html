<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Notice</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #eceef1;
            color: #1a1a1a;
        }

        header {
            text-align: center;
            padding: 24px 16px 8px;
        }
        header h1 {
            font-size: 1.6rem;
            margin: 0;
        }

        /* ---- Toggle bar ---- */
        .toggle-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(236, 238, 241, 0.85);
            backdrop-filter: blur(6px);
        }
        .toggle-bar button {
            border: 1px solid #cbd2da;
            background: #fff;
            color: #3c4a5a;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .toggle-bar button:hover { border-color: #8a97a6; }
        .toggle-bar button.active {
            background: #0a66ff;
            border-color: #0a66ff;
            color: #fff;
        }
        .toggle-bar .dims {
            display: block;
            text-align: center;
            width: 100%;
            font-size: 0.78rem;
            color: #6b7684;
            padding-top: 10px;
        }

        /* ---- Stage that holds the (scaled) device ---- */
        .stage {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px 16px 48px;
            overflow: hidden;
        }

        .device {
            transform-origin: top center;
            transition: none;
            background: #1c1c1e;
            position: relative;
            flex: none;
        }
        .device .screen {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            display: block;
        }

        /* ===== MacBook ===== */
        .device.macbook {
            padding: 14px 14px 14px;
            border-radius: 18px 18px 6px 6px;
        }
        .device.macbook .screen { border-radius: 4px; }
        /* camera notch */
        .device.macbook::before {
            content: "";
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 14px;
            background: #1c1c1e;
            border-radius: 0 0 10px 10px;
            z-index: 2;
        }

        /* ===== iPad ===== */
        .device.ipad {
            padding: 22px;
            border-radius: 42px;
        }
        .device.ipad .screen { border-radius: 22px; }
        .device.ipad::before { /* front camera dot */
            content: "";
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 7px;
            background: #3a3a3c;
            border-radius: 50%;
        }

        /* ===== iPhone 14 Pro ===== */
        .device.iphone {
            padding: 14px;
            border-radius: 56px;
        }
        .device.iphone .screen { border-radius: 44px; }
        .device.iphone::before { /* dynamic island */
            content: "";
            position: absolute;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            width: 118px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <header>
        <h1>Privacy Notice</h1>
    </header>

    <div class="toggle-bar">
        <button data-device="macbook" class="active">💻 MacBook</button>
        <button data-device="ipad">📱 iPad</button>
        <button data-device="iphone">📱 iPhone 14 Pro</button>
        <span class="dims" id="dims"></span>
    </div>

    <div class="stage" id="stage">
        <div class="device macbook" id="device">
            <iframe
                class="screen"
                id="notice"
                src="https://dsp-qa.securiti.xyz/notice-embed/3541369b-d1ee-4170-a61f-be6ae0ac91fd"
                title="Privacy Notice"></iframe>
        </div>
    </div>

    <script>
        // Screen (viewport) size the notice is rendered at, per device.
        const DEVICES = {
            macbook: { w: 1280, h: 800,  label: "MacBook · 1280 × 800" },
            ipad:    { w: 820,  h: 1180, label: "iPad · 820 × 1180" },
            iphone:  { w: 393,  h: 852,  label: "iPhone 14 Pro · 393 × 852" }
        };

        const stage   = document.getElementById('stage');
        const device  = document.getElementById('device');
        const screen  = document.getElementById('notice');
        const dimsEl  = document.getElementById('dims');
        const buttons = document.querySelectorAll('.toggle-bar button');

        let current = 'macbook';

        function setDevice(name) {
            current = name;
            const d = DEVICES[name];

            // swap frame styling class
            device.className = 'device ' + name;

            // set the inner screen (iframe) size = device viewport
            screen.style.width  = d.w + 'px';
            screen.style.height = d.h + 'px';

            dimsEl.textContent = d.label;

            buttons.forEach(b =>
                b.classList.toggle('active', b.dataset.device === name)
            );

            fit();
        }

        // Scale the whole device down so it always fits the window.
        function fit() {
            device.style.transform = 'scale(1)';
            const fullW = device.offsetWidth;
            const fullH = device.offsetHeight;

            const availW = stage.clientWidth - 32;
            const availH = window.innerHeight - stage.getBoundingClientRect().top - 24;

            const scale = Math.min(1, availW / fullW, availH / fullH);
            device.style.transform = 'scale(' + scale + ')';

            // reserve the scaled height so the page doesn't leave a gap / overflow
            stage.style.height = (fullH * scale) + 'px';
        }

        buttons.forEach(b =>
            b.addEventListener('click', () => setDevice(b.dataset.device))
        );
        window.addEventListener('resize', fit);

        setDevice('macbook');
    </script>
</body>
</html>
